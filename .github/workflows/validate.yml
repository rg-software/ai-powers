# Validates ai-powers content on every change. `main` is what every consuming
# project's CI clones and executes, so a broken skill here breaks all of them.
name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate skills and commands
        run: node scripts/validate.mjs

      - name: Test the trigger script
        run: node scripts/test-trigger-script.mjs

      - name: Lint the CI template YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('ci/pull-request-review.yml')); print('ci/pull-request-review.yml OK')"

      - name: Check the shipped layout
        run: |
          set -euo pipefail
          # The local workflows are skills; only the server-only review command
          # stays a command, because CI dispatches it with `opencode run --command`.
          for name in code-review-expert he9-commit he9-debt he9-push-pr he9-review \
                      he9-review-contract he9-start receiving-code-review; do
            [ -f "skills/${name}/SKILL.md" ] || { echo "missing skill: ${name}"; exit 1; }
          done
          [ -f "ci/commands/he9_pr_review.md" ] || { echo "missing server command: he9_pr_review"; exit 1; }
          [ ! -d skills/he9-pr-review ] || { echo "server-only command leaked into skills/"; exit 1; }
          [ ! -d commands ] || { echo "commands/ still exists; the local workflows are skills"; exit 1; }

          # Every skill must be discoverable by `npx skills add`, which reads
          # skills/ at the repo root and requires name + description.
          for file in skills/*/SKILL.md; do
            head -1 "$file" | grep -qx -- '---' || { echo "$file: missing frontmatter"; exit 1; }
            grep -q '^name:' "$file" || { echo "$file: missing name"; exit 1; }
            grep -q '^description:' "$file" || { echo "$file: missing description"; exit 1; }
          done

          echo "layout OK"
