# AI PR Reviewer — server-side code review on pull requests.
#
# Forge: works on Gitea Actions and GitHub Actions (both implement the octokit
# API surface and the actions used here). Place this file at
# `.gitea/workflows/` (Gitea) or `.github/workflows/` (GitHub), then set the
# repo variables and secrets listed in ai-powers docs/ci.md.
#
# SECURITY INVARIANT: this workflow runs under `pull_request_target`, so it is
# loaded from the PR's base branch and executes with base-context secrets even
# for untrusted PRs. Therefore it must NEVER execute, build, or otherwise run
# code that originates from the PR checkout (workspace files, the checked-out
# PR head, or anything fetched from the PR ref). Only trusted artifacts are
# ever executed: base-SHA project scripts, ai-powers at AI_POWERS_REF, and tools
# installed from the registry. If you add a step, review it against this rule
# before merging.
#
# The review run resolves configuration and skills only from the copies this
# workflow places under ~/.config/opencode. OpenCode V2 has no equivalent of
# 1.x's OPENCODE_DISABLE_EXTERNAL_SKILLS - it was verified to be ignored while
# .agents/skills stayed visible - so isolation rests on two things instead: the
# "Remove untrusted agent, skill and config trees" step, which deletes
# .agents/, .claude/, .opencode/ and opencode.json* from the checkout, and the
# skill allowlist in opencode-ci.json. Without them a checkout file would join
# the review's inputs. That is a correctness concern before it is a security
# one - a review should grade against the project it is reviewing, not against
# whatever that checkout happens to carry.

name: AI PR Reviewer

on:
  issue_comment:
    types: [created]
  # Trusted event: the workflow file and its scripts are loaded from the PR's
  # base branch (never from the PR head), so a PR author cannot modify this
  # workflow to run arbitrary steps with runner secrets.
  pull_request_target:
    types: [opened, synchronize] # Triggers on new PRs and new pushes to PRs
  # Manual run, to exercise the pipeline without waiting for a PR event.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write # Ensure PR write perms for commenting

jobs:
  respond:
    runs-on: ubuntu-latest
    environment: continue-actions
    steps:
      - name: Initial checkout (base context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Clone ai-powers first: it supplies the trigger script, the review
      # agent, the review skills, and the shared contract. Trusted because it
      # is a reviewed revision of our own repo, never anything from the PR.
      - name: Clone ai-powers (trusted, pinned)
        id: powers
        env:
          AI_POWERS_REPO: ${{ vars.AI_POWERS_REPO }}
          AI_POWERS_REF: ${{ vars.AI_POWERS_REF }}
        run: |
          set -euo pipefail
          : "${AI_POWERS_REPO:?AI_POWERS_REPO repo variable is required (owner/repo)}"
          : "${AI_POWERS_REF:?AI_POWERS_REF repo variable is required (branch or SHA)}"
          mkdir -p "$HOME/.gitea/trusted"
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${AI_POWERS_REPO}.git" "$HOME/.gitea/trusted/ai-powers"
          git -C "$HOME/.gitea/trusted/ai-powers" checkout --detach "$AI_POWERS_REF"
          sha="$(git -C "$HOME/.gitea/trusted/ai-powers" rev-parse HEAD)"
          echo "ai_powers_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ai-powers ref '${AI_POWERS_REF}' resolved to ${sha}"

      - name: Read trigger script
        id: read_script_content
        run: |
          echo "script_data<<EOF" >> $GITHUB_OUTPUT
          cat "$HOME/.gitea/trusted/ai-powers/ci/scripts/get-issue-data.js" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Evaluate triggers and fetch PR data
        id: setupenv
        uses: actions/github-script@v7
        env:
          # Optional: the mention that triggers a manual review. Defaults to
          # "@ai-reviewer" inside the script when unset.
          AI_REVIEW_MENTION: ${{ vars.AI_REVIEW_MENTION }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: ${{ steps.read_script_content.outputs.script_data }}

      # Check out the untrusted PR head so the AI can review it, but REMEMBER:
      # this workspace is attacker-controlled. No step below may execute any
      # file from it (see the SECURITY INVARIANT at the top of the file).
      - name: Checkout target code
        if: steps.setupenv.outputs.hit == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.setupenv.outputs.checkoutRef }}
          fetch-depth: 1

      - name: Remove untrusted agent, skill and config trees
        if: steps.setupenv.outputs.hit == 'true'
        run: |
          set -euo pipefail
          # OpenCode V2 dropped OPENCODE_DISABLE_EXTERNAL_SKILLS and always walks
          # .agents/skills and .claude/skills, and a project .opencode/skills
          # outranks the global copy. A pull request could therefore ship a
          # same-id skill that shadows the real reviewer - which is exactly how
          # PR #339 lost its review. Deleting the trees removes the ability to
          # impersonate; the skill allowlist in opencode-ci.json then covers
          # every other discovery source.
          #
          # This deletes only agent/skill/config trees. Source files stay: the
          # reviewer has to read them.
          rm -rf .agents .claude .opencode
          rm -f  opencode.json opencode.jsonc
          leftover="$(ls -A | grep -E '^\.(agents|claude|opencode)$|^opencode\.jsonc?$' || true)"
          if [ -n "$leftover" ]; then
            echo "REFUSING TO REVIEW - untrusted trees survived removal:"
            echo "$leftover"
            exit 1
          fi
          echo "untrusted agent/skill/config trees removed"

      - name: Fetch PR head branch
        if: steps.setupenv.outputs.hit == 'true'
        run: |
          git fetch origin "${{ steps.setupenv.outputs.prHeadRef }}" --depth=50

      - name: Fetch PR base branch
        if: steps.setupenv.outputs.hit == 'true'
        run: |
          git fetch origin "${{ steps.setupenv.outputs.prBaseSha }}" --depth=50

      - name: Prepare trusted review resources
        id: trusted
        if: steps.setupenv.outputs.hit == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/opencode/agents" "$HOME/.config/opencode/skills" "$HOME/.gitea/trusted"
          powers="$HOME/.gitea/trusted/ai-powers"

          # The server-only review agent -> the global agents dir (loaded even when
          # project config is disabled). V2 removed `opencode run --command`, so the
          # review is dispatched by agent name instead. The file name is the agent
          # id, which is why this stays he9_pr_review.md.
          [ -d "$powers/ci/agents" ] && cp "$powers/ci/agents/"*.md "$HOME/.config/opencode/agents/" || true

          # Skills (reviewer, responder, contract) -> the opencode config dir, NOT
          # ~/.agents/skills. That dir is one of the global discovery scopes V2
          # always scans, so these are present no matter what the checkout contains.
          cp -R "$powers/skills/." "$HOME/.config/opencode/skills/"

          # The review-text extractor ships with ai-powers too.
          node --check "$powers/ci/scripts/extract-review-text.js"

          # Sanity: everything the review run depends on must be present.
          [ -f "$HOME/.config/opencode/skills/he9-review-contract/SKILL.md" ]
          [ -f "$HOME/.config/opencode/skills/code-review-expert/SKILL.md" ]
          [ -f "$HOME/.config/opencode/agents/he9_pr_review.md" ]
          [ -f "$powers/ci/scripts/extract-review-text.js" ]

          # Write a locked-down permissions config for the review agent. This is
          # generated in-workflow (never read from the PR checkout) so a PR
          # cannot weaken it. V2 shape: an ordered `permissions` array, last
          # match wins, so the broad rules come first and the exceptions after.
          #
          # Three groups:
          #  - skill: an allowlist. `deny` hides a skill from the model and
          #    rejects loading it. This cannot stop a PR impersonating an
          #    allowed id - that is what the removal step is for - but it does
          #    stop any skill we did not name, including sources added later.
          #  - shell: read-only git/listing. V2 renamed `bash` to `shell`.
          #  - everything else: denied, so PR-injected content cannot exfiltrate
          #    the OpenRouter key through a tool.
          cat > "$HOME/.gitea/trusted/opencode-ci.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permissions": [
              { "action": "skill", "resource": "*", "effect": "deny" },
              { "action": "skill", "resource": "he9-review-contract", "effect": "allow" },
              { "action": "skill", "resource": "code-review-expert", "effect": "allow" },

              { "action": "shell", "resource": "*", "effect": "deny" },
              { "action": "shell", "resource": "git *", "effect": "allow" },
              { "action": "shell", "resource": "git diff*", "effect": "allow" },
              { "action": "shell", "resource": "git show*", "effect": "allow" },
              { "action": "shell", "resource": "git status*", "effect": "allow" },
              { "action": "shell", "resource": "git log*", "effect": "allow" },
              { "action": "shell", "resource": "git ls-files*", "effect": "allow" },
              { "action": "shell", "resource": "git ls-tree*", "effect": "allow" },
              { "action": "shell", "resource": "git cat-file*", "effect": "allow" },
              { "action": "shell", "resource": "git rev-parse*", "effect": "allow" },
              { "action": "shell", "resource": "git name-rev*", "effect": "allow" },
              { "action": "shell", "resource": "git push*", "effect": "deny" },
              { "action": "shell", "resource": "git fetch*", "effect": "deny" },
              { "action": "shell", "resource": "git pull*", "effect": "deny" },
              { "action": "shell", "resource": "git remote*", "effect": "deny" },
              { "action": "shell", "resource": "git add*", "effect": "deny" },
              { "action": "shell", "resource": "git commit*", "effect": "deny" },
              { "action": "shell", "resource": "git checkout*", "effect": "deny" },
              { "action": "shell", "resource": "git reset*", "effect": "deny" },
              { "action": "shell", "resource": "rg *", "effect": "allow" },
              { "action": "shell", "resource": "grep *", "effect": "allow" },
              { "action": "shell", "resource": "ls *", "effect": "allow" },
              { "action": "shell", "resource": "node *", "effect": "deny" },
              { "action": "shell", "resource": "echo *", "effect": "deny" },
              { "action": "shell", "resource": "env *", "effect": "deny" },
              { "action": "shell", "resource": "printenv *", "effect": "deny" },
              { "action": "shell", "resource": "export *", "effect": "deny" },
              { "action": "shell", "resource": "curl *", "effect": "deny" },
              { "action": "shell", "resource": "wget *", "effect": "deny" },
              { "action": "shell", "resource": "nc *", "effect": "deny" },

              { "action": "webfetch", "resource": "*", "effect": "deny" },
              { "action": "websearch", "resource": "*", "effect": "deny" },
              { "action": "edit", "resource": "*", "effect": "deny" },
              { "action": "question", "resource": "*", "effect": "deny" },
              { "action": "subagent", "resource": "*", "effect": "deny" }
              # Deliberately NOT denying external_directory. The runner mounts
              # the workspace, so opencode's realpath for in-project files can
              # fall outside the project worktree - and denying the boundary
              # then blocks the base-SHA conventions and specs too. Measured: both
              # repos reported drift as "not graded" because their conventions
              # could not be read. The skill allowlist above, plus the deleted
              # untrusted trees, already bound what the review can load.
            ]
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('$HOME/.gitea/trusted/opencode-ci.json','utf8'))" && echo "opencode-ci.json is valid JSON"

          echo "opencode_config=$HOME/.gitea/trusted/opencode-ci.json" >> "$GITHUB_OUTPUT"
          ls -la "$HOME/.config/opencode/agents" "$HOME/.config/opencode/skills" "$HOME/.gitea/trusted"

      - name: Setup Node.js
        if: steps.setupenv.outputs.hit == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup OpenCode CLI
        if: steps.setupenv.outputs.hit == 'true'
        env:
          # Optional per-repo override; otherwise the version pinned in ai-powers,
          # which is versioned alongside the event extractor it must stay in
          # step with.
          OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION }}
        run: |
          set -euo pipefail
          pinned="$(cat "$HOME/.gitea/trusted/ai-powers/ci/opencode-version" 2>/dev/null || echo 2.0.25)"
          version="${OPENCODE_VERSION:-$pinned}"

          # The runner image ships its own opencode, which owns the `opencode`
          # bin link. 1.x installed cleanly only because the package name
          # matched, so npm updated it in place; V2 ships under a different name
          # and collides with the link it does not own (npm EEXIST). Drop the
          # incumbent first, then install the pinned version.
          npm uninstall -g @opencode/cli opencode-ai >/dev/null 2>&1 || true
          prefix="$(npm prefix -g)"
          rm -f "$prefix/bin/opencode" "$prefix/bin/opencode2"

          # V2 ships as a different npm package than 1.x. Keeping the name in one
          # place here means the version file stays a bare version string.
          echo "installing @opencode/cli@${version}"
          npm i -g "@opencode/cli@${version}"

          # Prove the binary exists and is the version we asked for. Without this
          # a bad install fails later, in the run step, with no clue why.
          installed="$(opencode --version 2>&1 | head -1)"
          echo "installed: ${installed}"
          case "$installed" in
            *"${version}"*) ;;
            *) echo "expected opencode ${version}, got: ${installed}"; exit 1 ;;
          esac

      - name: Generate PR diff
        if: steps.setupenv.outputs.hit == 'true'
        run: |
          git diff "${{ steps.setupenv.outputs.prBaseSha }}"..."${{ steps.setupenv.outputs.prHeadSha }}" > pr-diff.txt

      - name: Run analysis
        if: steps.setupenv.outputs.hit == 'true'
        id: analyze
        env:
          COMMENT_BODY: ${{ steps.setupenv.outputs.commentBody }}
          ENTITY_NUMBER: ${{ steps.setupenv.outputs.entityNumber }}
          ENTITY_TITLE: ${{ steps.setupenv.outputs.entityTitle }}
          ENTITY_BODY: ${{ steps.setupenv.outputs.entityBody }}
          PRHEADSHA: ${{ steps.setupenv.outputs.prHeadSha }}
          PRBASESHA: ${{ steps.setupenv.outputs.prBaseSha }}
          SHAS: ${{ steps.setupenv.outputs.prCommitsShas }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL_NAME: ${{ vars.AI_MODEL_NAME }}
          OPENCODE_CONFIG: ${{ steps.trusted.outputs.opencode_config }}
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          # Keep the review grounded in what ai-powers provides rather than what
          # the checkout happens to contain. The "Remove untrusted agent, skill
          # and config trees" step deleted .agents/, .claude/, .opencode/ and
          # opencode.json* from the workspace, so there is nothing project-scoped
          # left to load; this flag is the second layer over that.
          #
          # V2 has no equivalent of 1.x's OPENCODE_DISABLE_EXTERNAL_SKILLS - it
          # was verified to be ignored, while .agents/skills stayed visible. The
          # skill allowlist in opencode-ci.json is what replaces it.
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"
        run: |
          # Read and truncate the diff to avoid blowing up context
          DIFF_CONTENT="(no diff available)"
          if [ -f pr-diff.txt ]; then
            DIFF_CONTENT=$(head -c 50000 pr-diff.txt)
            if [ "$(wc -c < pr-diff.txt)" -gt 50000 ]; then
              DIFF_CONTENT="${DIFF_CONTENT}
          ... [diff truncated at 50000 characters]"
            fi
          fi

          # Construct the PR context passed to the review agent as the user message
          PROMPT="### PULL REQUEST DATA
          Number: ${ENTITY_NUMBER}
          Title: ${ENTITY_TITLE}
          Description: ${ENTITY_BODY}
          Head SHA: ${PRHEADSHA}
          Base SHA: ${PRBASESHA}
          Commits: ${SHAS}

          ### CODE DIFF
          \`\`\`diff
          ${DIFF_CONTENT}
          \`\`\`

          ### TRIGGERING COMMAND
          ${COMMENT_BODY}"

          # Run the review agent headless. Stream events as JSON so the final
          # assistant text can be extracted cleanly for the PR comment.
          # --standalone: V2 otherwise discovers or starts a shared per-user
          # background server. On a runner there is no user session to inherit,
          # and the shared server owns config and permissions, so a private
          # server is the only way to be sure this run uses the config above.
          # Note: this step runs under `bash -e` (act default), so a failing
          # opencode run must not abort the script before diagnostics are printed.
          set +e
          opencode run \
            --standalone \
            --agent he9_pr_review \
            --model "openrouter/${AI_MODEL_NAME}" \
            --auto \
            --format json \
            -- "$PROMPT" \
            > /tmp/review-events.jsonl 2> /tmp/opencode-run.err
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "opencode run failed with exit code $EXIT_CODE"
            echo "--- stderr ---"
            tail -n 50 /tmp/opencode-run.err || true
            echo "--- review-events.jsonl tail ---"
            tail -n 50 /tmp/review-events.jsonl || true
            exit $EXIT_CODE
          fi

          node "$HOME/.gitea/trusted/ai-powers/ci/scripts/extract-review-text.js" \
            < /tmp/review-events.jsonl > /tmp/review.txt

          EOF_DELIMITER="END_OF_REVIEW_OUTPUT_$(date +%s)"
          echo "review_output<<$EOF_DELIMITER" >> "$GITHUB_OUTPUT"
          cat /tmp/review.txt >> "$GITHUB_OUTPUT"
          # The extractor trims trailing whitespace, so ensure the delimiter
          # lands on its own line or act rejects the GITHUB_OUTPUT block.
          printf '\n' >> "$GITHUB_OUTPUT"
          echo "$EOF_DELIMITER" >> "$GITHUB_OUTPUT"

      - name: Post response
        if: steps.setupenv.outputs.hit == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.setupenv.outputs.entityNumber }}
          RESULT: ${{ steps.analyze.outputs.review_output }}
          AI_POWERS_SHA: ${{ steps.powers.outputs.ai_powers_sha }}
        with:
          github-token: ${{ secrets.AIR_GITEA_API_TOKEN }}
          script: |
            // A stable marker identifies this bot's reviews independent of the
            // token's user name. he9-review respond matches on it.
            const MARKER = "<!-- he9-reviewer:v1 -->";
            const body = (process.env.RESULT || "(no output from AI model)").trim();
            const footer = `\n\n---\n<sub>ai-powers@${process.env.AI_POWERS_SHA || "unknown"}</sub>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `${MARKER}\n${body}${footer}`
            });
