# Example openspec/config.yaml — ai-powers reference implementation, taken from
# a real project. Copy to <project>/openspec/config.yaml and replace the
# project-specific facts (name, stack, canonical sources, system names).
#
# What the OpenSpec skills actually see:
#   context:      injected into EVERY artifact-generation prompt and returned by
#                 `openspec instructions apply/archive` as required input — the
#                 TDD paragraph below is what carries the GREEN-gate to apply.
#   rules.<id>:   injected ONLY when that artifact is authored. rules.specs
#                 shapes spec text at propose time; it never reaches apply.
#   operations:   optional advisory guidance for apply/archive — unused here.
#
# Keep context short: it is a prompt injected everywhere, not documentation.
# Canonical detail lives in conventions.md; context points at it and inlines
# only the cross-cutting binding statements.

schema: spec-driven

context: |
  Railway Riddles is a train-themed 2D puzzle game built in Unity 6 (URP).

  Canonical sources:
  - Specs: `specs/`
  - Code conventions: `conventions.md`
  - Asset layout: `docs/project-structure.md`

  When prewritten RED tests exist (he9-tdd → apply), the TDD handoff and
  red-test routing rules in `conventions.md` are binding: reuse tests,
  GREEN-gate completion, no weakening, report evidence; route red tests by
  cause and record disputes rather than weakening them.

rules:
  proposal:
    - State the motivation and scope clearly; include a "Non-goals" section.
    - Reference affected specs from openspec/specs/ where relevant.

  # rules.specs shapes the spec text he9-tdd parses: assertable THENs at
  # generation time mean fewer "spec quality gaps" in the RED report.
  specs:
    - Each requirement has at least one scenario; scenarios use GIVEN/WHEN/THEN.
    - THEN clauses state mechanically assertable outcomes (a value, state, or
      error) - never "works correctly" or "updates the UI".
    - Every requirement includes a failure/edge scenario, not only happy paths.

  design:
    - Include data-flow or component diagrams where helpful.
    - Call out impacts on existing systems (PlayerPrefs keys, Messenger events, etc.).

  # rules.tasks shapes task authoring only. The GREEN-gate itself reaches apply
  # through the context paragraph above — not through these lines.
  tasks:
    - Break tasks into small, cohesive, independently verifiable changes.
    - Each task should be independently verifiable.
    - Include a testing task as the final step of each feature.
    - When prewritten RED tests exist, honor them as the contract - reuse rather
      than duplicate, implement until GREEN, never weaken assertions to pass.

# Optional advisory guidance for the apply/archive sessions (unused above):
# operations:
#   apply:
#     guidance:
#       - Run focused tests during iteration; the full suite runs in CI.
#   archive:
#     guidance:
#       - Run the verify workflow before archiving; fold deviations into delta specs.
